# Projeto isolado: nome, rede e volume próprios, nenhuma porta publicada, nenhum volume
# ou rede compartilhados com outros projetos do servidor.
name: price-tracker

services:
  tracker:
    build: .
    image: price-tracker:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - tracker_data:/data
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tracker_data:
