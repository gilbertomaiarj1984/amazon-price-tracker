# Projeto isolado: nome e volume próprios, nenhuma porta publicada. Única exceção de rede:
# a rede externa `proxy`, a mesma do AgendaBoa e do pdf-unite, para o Caddy alcançar o painel
# (docs/painel.md). O container não tem `ports:`; só o Caddy (com login) expõe o painel.
name: price-tracker

services:
  tracker:
    build: .
    image: price-tracker:local
    restart: unless-stopped
    env_file: .env
    environment:
      PANEL_PORT: "8787"
      PANEL_HOST: "0.0.0.0"
    networks:
      - default
      - proxy
    volumes:
      - tracker_data:/data
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true

volumes:
  tracker_data:
